<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>또덕이 온천</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wall:#fdf7c5; --ink:#1c1000; --line:#ff9b1c;
    --desk:#fecb86; --wood:#7b6253; --red:#ff3d28;
    --boy:#6a5cff; --girl:#ff4f8b;
  }
  @font-face{
    font-family:"Sehyun"; src:url(fonts/UhBeeSe_hyunBold.ttf) format("truetype");
    font-weight:400 700; font-display:swap;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--wood); color:var(--ink);
    font-family:"Sehyun","UhBee Se_hyun","Gaegu","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    display:flex; align-items:flex-start; justify-content:center;
    overscroll-behavior:none; touch-action:manipulation; user-select:none; -webkit-user-select:none;
  }
  .game{
    width:min(100vw, calc(100dvh - 229px), 760px);
    display:flex; flex-direction:column;
  }
  .scene{
    position:relative; width:100%; aspect-ratio:1/1;
    background:var(--wall); overflow:hidden;
    container-type:inline-size;
  }
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block}

  .door{
    position:absolute; top:4.5%; height:25.5%; width:16%;
    background:transparent; border:0; padding:0; cursor:pointer; border-radius:1.5cqw;
  }
  .door.left{left:2.6%} .door.right{left:74.6%}
  .door:focus-visible{outline:.7cqw solid var(--ink); outline-offset:.4cqw}
  .scene.asking .door{animation:glow 1.1s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 0 .9cqw rgba(255,255,255,.75)}}

  .layer{position:absolute; inset:0; pointer-events:none; will-change:transform}
  .layer > *{pointer-events:auto}
  .fx{position:absolute; inset:0; z-index:3; pointer-events:none; overflow:hidden}
  .gain{
    position:absolute; transform:translate(-50%,-50%); white-space:nowrap;
    font-size:5.4cqw; font-weight:700; color:var(--ink);
    text-shadow:.35cqw 0 #fff, -.35cqw 0 #fff, 0 .35cqw #fff, 0 -.35cqw #fff, .25cqw .25cqw #fff, -.25cqw -.25cqw #fff, .25cqw -.25cqw #fff, -.25cqw .25cqw #fff;
    animation:gain 1.1s ease-out forwards;
  }
  @keyframes gain{0%{opacity:0; margin-top:2cqw} 15%{opacity:1} 70%{opacity:1} 100%{opacity:0; margin-top:-4cqw}}
  .fly{position:absolute; width:8cqw; height:auto; margin:-4cqw 0 0 -4cqw}
  .wallet.bump{animation:bump .35s ease-out}
  @keyframes bump{40%{transform:scale(1.22); background:#ffe27a}}
  .wallet{
    position:absolute; right:1.5%; top:1.5%; z-index:2; pointer-events:none;
    background:#fff; border:.55cqw solid var(--ink); border-radius:2.6cqw; padding:.5cqw 2cqw .5cqw 1.4cqw;
    font-size:4.2cqw; font-weight:700; line-height:1.2; font-variant-numeric:tabular-nums;
  }
  .locked{
    position:absolute; inset:0; display:none; place-content:center; justify-items:center; gap:1.5cqw;
    background:rgba(28,16,0,.55); color:#fff; font-size:5cqw; font-weight:700; pointer-events:none !important;
  }
  .locked svg{width:20cqw; height:20cqw}
  .layer.is-locked .locked{display:grid}
  .layer.is-locked .shop, .layer.is-locked .hot{display:none}
  .hot{position:absolute; background:transparent; border:0; padding:0; cursor:pointer; border-radius:1.5cqw}
  .hot:focus-visible{outline:.7cqw solid var(--red); outline-offset:.3cqw}
  .hot:active{background:rgba(255,255,255,.35)}
  .count{font-size:4.4cqw; font-weight:700; padding:0 1.5cqw; font-variant-numeric:tabular-nums}
  .item .pic.unknown{filter:brightness(0); opacity:.28}
  .stars{font-size:4.2cqw; font-weight:700; padding:0 1cqw; white-space:nowrap; color:var(--line); text-shadow:0 0 .3cqw var(--ink)}
  .stars small{display:block; font-size:3cqw; color:var(--ink); text-shadow:none; text-align:center}
  .empty{font-size:3.8cqw; text-align:center; padding:6cqw 2cqw; opacity:.75}
  .ohint{position:absolute; top:40%; z-index:3; width:17cqw; padding:1.6cqw 1.6cqw 1.4cqw; background:#fff; border:.6cqw solid var(--ink); cursor:pointer; display:grid; gap:.8cqw; justify-items:center; animation:hintBob .9s ease-in-out infinite alternate}
  .ohint[hidden]{display:none}
  .ohint.left{left:1.5cqw; border-radius:5cqw 5cqw 5cqw 1cqw} .ohint.right{right:1.5cqw; border-radius:5cqw 5cqw 1cqw 5cqw}
  .ohint img{width:11cqw; height:9cqw; object-fit:contain}
  .ohint span{width:100%; height:1.8cqw; border:.4cqw solid var(--ink); border-radius:1cqw; background:#fff; overflow:hidden; display:block}
  .ohint i{display:block; height:100%; background:#5fce5a}
  .ohint::after{content:''; position:absolute; top:50%; width:0; height:0; border:2.2cqw solid transparent; margin-top:-2.2cqw}
  .ohint.left::after{left:-4.6cqw; border-right-color:var(--ink)} .ohint.right::after{right:-4.6cqw; border-left-color:var(--ink)}
  @keyframes hintBob{from{transform:translateY(-1cqw)} to{transform:translateY(1cqw)}}
  .banner{
    position:absolute; left:0; right:0; top:16%; margin:auto; width:max-content; max-width:88%; z-index:4;
    background:#ffe27a; border:.6cqw solid var(--ink); border-radius:3cqw; padding:1.2cqw 3cqw;
    font-size:4.2cqw; font-weight:700; text-align:center; line-height:1.3; pointer-events:none;
    opacity:0; transform:translateY(-2cqw) scale(.9); transition:opacity .25s, transform .25s;
  }
  .banner.show{opacity:1; transform:none}
  .scene{touch-action:none}
  #hudPop{font:inherit; color:inherit; background:none; border:0; padding:0 0 0 12px; cursor:pointer}
  #hudPop b{color:#ff9d00; font-weight:700; letter-spacing:1px} #hudPop i{font-style:normal; opacity:.28; letter-spacing:1px}
  .hud{
    background:var(--desk); border-top:4px solid var(--ink); padding:8px 14px 0;
    font-size:19px; font-weight:700; line-height:1.2; font-variant-numeric:tabular-nums;
    display:flex; justify-content:space-between; align-items:center;
  }
  .bubble{
    position:absolute; left:.5%; bottom:57%; width:40%; aspect-ratio:760/547;
    background:url(img/bubble.png) center/100% 100% no-repeat;
    display:flex; align-items:center; justify-content:center;
    padding:4.6cqw 10cqw 5.4cqw 5cqw;
    font-size:3.6cqw; font-weight:700; line-height:1.3;
    text-align:center; text-wrap:balance; word-break:keep-all;
    pointer-events:none !important;
    transform-origin:98% 88%; transform:scale(0); opacity:0;
    transition:transform .22s cubic-bezier(.3,1.5,.5,1), opacity .15s;
  }
  .bubble.show{transform:scale(1); opacity:1}

  .shop{
    position:absolute; right:1.5%; top:19.5%; width:10.5cqw; height:10.5cqw; padding:0;
    background:#fff; border:.55cqw solid var(--ink); border-radius:2.6cqw; cursor:pointer;
    box-shadow:0 .7cqw 0 var(--ink); display:grid; place-items:center;
  }
  .shop svg{width:82%; height:82%; display:block}
  .shop:active{transform:translateY(.5cqw); box-shadow:0 .2cqw 0 var(--ink)}
  .shop:focus-visible{outline:.7cqw solid var(--red); outline-offset:.3cqw}
  .level{
    position:absolute; left:1.5%; top:1.5%; z-index:2; pointer-events:none;
    background:#fff; border:.55cqw solid var(--ink); border-radius:2.6cqw; padding:.5cqw 2cqw .9cqw;
    font-size:4.2cqw; font-weight:700; line-height:1.2; text-align:center; min-width:17cqw;
  }
  .level .bar{display:block; height:1.3cqw; margin-top:.3cqw; border-radius:1cqw; background:#eadfb0; overflow:hidden}
  .level .fill{display:block; height:100%; width:0; background:var(--line); transition:width .3s}
  .level.up{animation:levelup .9s ease-out}
  @keyframes levelup{0%{transform:scale(1)} 30%{transform:scale(1.35) rotate(-4deg); background:#ffe27a} 100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){ .level.up{animation:none} }
  .coin{height:1.4em; width:auto; vertical-align:-.34em; margin-right:.15em}
  .sheet-wrap{
    position:absolute; inset:0; z-index:5; display:none; align-items:center; justify-content:center;
    background:rgba(28,16,0,.45);
  }
  .sheet-wrap.open{display:flex}
  .sheet{
    width:92%; max-height:94%; display:flex; flex-direction:column; overflow:hidden;
    background:var(--wall); border:.6cqw solid var(--ink); border-radius:4cqw;
  }
  .sheet-head{
    display:flex; align-items:center; gap:2cqw; padding:1.6cqw 2.2cqw;
    background:var(--desk); border-bottom:.6cqw solid var(--ink); font-size:4.8cqw; font-weight:700;
  }
  .sheet-head .money{
    margin-left:auto; background:#fff; border:.45cqw solid var(--ink); border-radius:2.4cqw;
    padding:.2cqw 1.8cqw; font-size:3.7cqw; font-variant-numeric:tabular-nums;
  }
  .x{
    font:inherit; font-size:5cqw; font-weight:700; line-height:1; color:var(--ink);
    width:9.5cqw; height:9.5cqw; border:.45cqw solid var(--ink); border-radius:2.4cqw; background:#fff; cursor:pointer;
  }
  .tabs{display:flex; gap:1.4cqw; padding:1.8cqw 2.2cqw 0}
  .tabs:empty{display:none}
  .tab{
    flex:1; font:inherit; font-size:3.9cqw; font-weight:700; color:var(--ink); padding:1.4cqw; cursor:pointer;
    border:.45cqw solid var(--ink); border-bottom:0; border-radius:2.6cqw 2.6cqw 0 0; background:var(--desk);
  }
  .tab[aria-selected="true"]{background:#fff}
  .list{
    background:#fff; border-top:.45cqw solid var(--ink); padding:1.8cqw 2.2cqw 2.4cqw;
    display:grid; gap:1.5cqw; overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y;
  }
  .sub{font-size:3.7cqw; font-weight:700; margin:.4cqw 0 -.3cqw}
  .item{
    display:grid; grid-template-columns:13cqw 1fr auto; gap:2cqw; align-items:center;
    border:.45cqw solid var(--ink); border-radius:2.6cqw; padding:1.2cqw 1.6cqw; background:#fffdf0;
  }
  .item .pic{width:13cqw; height:10.6cqw; border-radius:1.6cqw; border:.35cqw solid var(--ink); object-fit:cover; background:#fff}
  .item .pic.fit{object-fit:contain; padding:.6cqw}
  .item .pic.swatch{background:#ecd0aa}
  .item .name{font-size:4.1cqw; font-weight:700; line-height:1.3}
  .item .desc{font-size:3.05cqw; opacity:.75; line-height:1.3}
  .act{
    font:inherit; font-size:3.5cqw; font-weight:700; color:var(--ink); white-space:nowrap; cursor:pointer;
    min-width:19cqw; min-height:10cqw; padding:1cqw 1.6cqw;
    border:.45cqw solid var(--ink); border-radius:2.2cqw; background:var(--line); box-shadow:0 .6cqw 0 var(--ink);
  }
  .act:active:not(:disabled){transform:translateY(.4cqw); box-shadow:0 .2cqw 0 var(--ink)}
  .act.on{background:#d8f0c8}
  .act:disabled{background:#eee; opacity:.6; box-shadow:none; cursor:default}
  .act.on:disabled{background:#d8f0c8; opacity:1}
  .x:focus-visible,.tab:focus-visible,.act:focus-visible{outline:.7cqw solid var(--red); outline-offset:.2cqw}

  .loading{
    position:absolute; inset:0; display:grid; place-items:center;
    background:var(--wall); font-size:7cqw; font-weight:700;
  }
  .loading[hidden]{display:none}

  .controls{padding:8px 12px 14px; background:var(--desk); height:101px}
  .guide{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .guide button{
    font:inherit; font-size:22px; font-weight:700; color:var(--ink);
    min-height:74px; border:4px solid var(--ink); border-radius:20px;
    background:#fff; cursor:pointer;
    box-shadow:0 5px 0 var(--ink); transition:transform .06s, box-shadow .06s, opacity .15s;
  }
  .guide button:active:not(:disabled), .bag button:active{transform:translateY(4px); box-shadow:0 1px 0 var(--ink)}
  .guide button:disabled{opacity:.4; cursor:default}
  .guide button:focus-visible, .bag button:focus-visible{outline:4px solid var(--red); outline-offset:2px}
  .controls.away .guide, .controls.onsen .guide{display:none}   /* 카운터가 아닐 때는 안내 버튼을 숨겨요 */
  /* 온천방에서는 그 자리에 가진 음식이 나와요 */
  .bag{display:none; gap:8px; height:84px; padding:10px 4px 0; overflow-x:auto; overscroll-behavior:contain; align-items:flex-start}
  .controls.onsen .bag{display:flex}
  .bag button{
    position:relative; flex:0 0 62px; height:62px; padding:4px; cursor:pointer;
    background:#fff; border:4px solid var(--ink); border-radius:18px; box-shadow:0 5px 0 var(--ink);
  }
  .bag img{width:100%; height:100%; object-fit:contain; display:block; pointer-events:none}
  .bag .n{
    position:absolute; right:-7px; top:-8px; min-width:26px; height:26px; padding:0 5px; border-radius:13px;
    background:var(--red); color:#fff; border:3px solid var(--ink); font:inherit; font-size:15px; font-weight:700; line-height:20px; text-align:center;
  }
  .bag .hint{align-self:center; font-size:18px; font-weight:700; line-height:1.3; padding:0 6px}
  /* 버튼 칸 아래 남는 자리: 상점 */
  .dock{display:flex; justify-content:center; gap:14px; padding:10px 12px 12px; background:var(--wood)}
  .dockbtn{
    width:64px; height:64px; padding:6px; cursor:pointer; display:grid; place-items:center;
    background:#fff; border:4px solid var(--ink); border-radius:18px; box-shadow:0 5px 0 var(--ink);
  }
  .dockbtn svg{width:100%; height:100%; display:block}
  .dockbtn{position:relative; flex:0 1 64px; width:auto; height:auto; aspect-ratio:1; min-width:0} .dock{gap:10px}
  /* 랭킹 */
  .rankrow{display:grid; grid-template-columns:9cqw 1fr auto; gap:2cqw; align-items:center; border:.45cqw solid var(--ink); border-radius:2.6cqw; padding:1.4cqw 2.2cqw; background:#fffdf0; font-size:4cqw}
  .rankrow.me{background:#ffe9a8}
  .rankrow .no{font-weight:700; text-align:center; font-variant-numeric:tabular-nums}
  .rankrow .top{font-size:5.4cqw}
  .rankrow .who{font-weight:700; overflow-wrap:anywhere; min-width:0}
  .rankrow .who small{font-size:3.2cqw; font-weight:400; opacity:.75; margin-left:1cqw}
  .rankrow .n{text-align:right; font-size:3.5cqw; line-height:1.25; font-variant-numeric:tabular-nums}
  .rankrow .n b{display:block; font-size:4cqw}
  .dockbtn .dot{position:absolute; top:-7px; right:-7px; width:18px; height:18px; border-radius:50%; background:var(--red, #ff3d28); border:3px solid var(--ink)}
  .dockbtn .dot[hidden]{display:none}
  .review{border:.45cqw solid var(--ink); border-radius:2.6cqw; padding:1.6cqw 2cqw; background:#fffdf0; display:grid; grid-template-columns:11cqw 1fr; gap:2cqw; align-items:center}
  .review img{width:11cqw; height:11cqw; object-fit:contain}
  .stars{font-size:4.2cqw; color:#ff9d00; letter-spacing:.3cqw} .stars i{font-style:normal; color:#1c1000; opacity:.2}
  .review .txt{font-size:3.5cqw; line-height:1.35}
  .avg{font-size:4.2cqw; font-weight:700; text-align:center; padding:1cqw 0}
  .dockbtn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--ink)}
  .dockbtn:focus-visible{outline:4px solid var(--red); outline-offset:2px}
  /* 설정: 소리 크기 */
  .setrow{
    display:grid; grid-template-columns:23cqw 1fr 9cqw; gap:2cqw; align-items:center;
    border:.45cqw solid var(--ink); border-radius:2.6cqw; padding:2cqw 2.4cqw; background:#fffdf0;
    font-size:4.1cqw; font-weight:700;
  }
  .setrow input{width:100%; height:9cqw; margin:0; accent-color:var(--line); cursor:pointer}
  .setrow output{text-align:right; font-variant-numeric:tabular-nums}
  .act.wide{width:100%}
  /* 처음 하는 사람용 안내: 봐야 할 곳만 밝게, 나머지는 반투명 회색 */
  .nick{position:fixed; inset:0; z-index:60; background:rgba(40,28,12,.62); display:grid; place-items:center; padding:20px}
  .nick[hidden]{display:none}
  .nick-box{width:min(340px, 100%); background:#fff6dc; border:4px solid var(--ink); border-radius:22px; padding:20px 18px 18px; display:grid; gap:10px; text-align:center; box-shadow:0 6px 0 var(--ink)}
  .nick-box h2{margin:0; font-size:24px} .nick-box p{margin:0; font-size:16px}
  .nick-box input{font:inherit; font-size:22px; font-weight:700; text-align:center; padding:10px; border:3px solid var(--ink); border-radius:14px; background:#fff; color:var(--ink); width:100%; box-sizing:border-box}
  .nick-box input:focus-visible{outline:4px solid var(--red, #ff3d28); outline-offset:2px}
  .nick-box button{font:inherit; font-size:22px; font-weight:700; padding:10px; border:3px solid var(--ink); border-radius:14px; background:#ffd23e; color:var(--ink); box-shadow:0 4px 0 var(--ink); cursor:pointer}
  .nick-box button:active{transform:translateY(4px); box-shadow:none}
  .nick-err{color:#d42a17; min-height:1.2em}
  .tut{position:fixed; inset:0; z-index:50; pointer-events:none}
  .tut[hidden]{display:none}
  .tut-hole{
    position:fixed; border-radius:18px; outline:4px solid #fff;
    box-shadow:0 0 0 200vmax rgba(70,70,70,.62);
    transition:left .25s, top .25s, width .25s, height .25s;
  }
  .tut-box{
    position:fixed; left:50%; transform:translateX(-50%); width:min(92vw, 420px);
    background:#fff; border:4px solid var(--ink); border-radius:18px; padding:12px 14px 10px;
    font-size:19px; font-weight:700; line-height:1.35; text-align:center; pointer-events:auto;
    box-shadow:0 5px 0 var(--ink); transition:top .25s;
  }
  .tut-box p{margin:0 0 8px; white-space:pre-line}
  .tut-row{display:flex; gap:8px; justify-content:center}
  .tut-row button{
    font:inherit; font-size:16px; font-weight:700; color:var(--ink); cursor:pointer;
    min-height:40px; padding:0 16px; border:3px solid var(--ink); border-radius:12px; background:#eee;
  }
  .tut-row #tutOk{background:var(--line)}
  .tut-row button[hidden]{display:none}
  .tut-row button:focus-visible{outline:3px solid var(--red); outline-offset:2px}
  .tut-hand{
    position:fixed; width:64px; height:64px; margin:-32px 0 0 -32px; border-radius:50%;
    background:#fff; border:4px solid var(--ink); display:grid; place-items:center;
    animation:tuthand 1.3s ease-in-out infinite;
  }
  .tut-hand[hidden]{display:none}
  .tut-hand svg{width:38px; height:38px; transform:rotate(var(--rot, 0deg))}
  @keyframes tuthand{0%{transform:translate(calc(var(--dx) * -1), calc(var(--dy) * -1)); opacity:0} 20%{opacity:1} 80%{opacity:1} 100%{transform:translate(var(--dx), var(--dy)); opacity:0}}
  @media (prefers-reduced-motion:reduce){ .tut-hand{animation:none} .tut-hole,.tut-box{transition:none} }
  .controls .arrow{display:inline-block; font-size:25px; transform:translateY(1px)}
</style>
</head>
<body>
<main class="game">
  <div class="scene" id="scene">
    <canvas id="cv" width="900" height="900" aria-label="온천 카운터. 손님 또덕이가 문에서 카운터로 걸어옵니다."></canvas>
    <div class="layer" id="lobbyUi">
      <button class="door left" id="doorL" aria-label="왼쪽 문으로 안내"></button>
      <button class="door right" id="doorR" aria-label="오른쪽 문으로 안내"></button>
      <div class="bubble" id="bubble" role="status" aria-live="polite"></div>
    </div>
    <div class="layer" id="menUi">
      <button class="shop" id="setM" aria-label="남자 온천 설정">
        <svg viewBox="0 0 48 48" fill="none" stroke="#ff3d28" stroke-width="3.4" stroke-linecap="round" aria-hidden="true">
          <path d="M8 27c0 8 7 13 16 13s16-5 16-13"/>
          <path d="M16 8c-3 5 3 8 0 14M24 6c-3 5 3 9 0 16M32 8c-3 5 3 8 0 14"/>
        </svg>
      </button>
    </div>
    <div class="layer" id="womenUi">
      <button class="shop" id="setF" aria-label="여자 온천 설정">
        <svg viewBox="0 0 48 48" fill="none" stroke="#ff3d28" stroke-width="3.4" stroke-linecap="round" aria-hidden="true">
          <path d="M8 27c0 8 7 13 16 13s16-5 16-13"/>

<script>
(() => {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const scene = document.getElementById('scene');
  const bubble = document.getElementById('bubble');
  const btnL = document.getElementById('btnL'), btnR = document.getElementById('btnR');
  // 그림판 크기: 화면에 맞춰 필요한 만큼만 (작을수록 가벼워요)
  // (화면 크기가 바뀌면 다시 재요. 처음에 작은 창으로 열렸다가 커져도 흐려지지 않게)
  const sizeFor = () => Math.max(720, Math.min(1400, Math.round((scene.clientWidth || 450) * Math.min(window.devicePixelRatio || 1, 3))));
  let S = sizeFor();
  cv.width = cv.height = S;
  const resized = () => { const n = sizeFor(); if (Math.abs(n - S) < 8) return; S = n; cv.width = cv.height = S; ctx.imageSmoothingQuality = 'high'; tubCache.clear(); };
  if (window.ResizeObserver) new ResizeObserver(resized).observe(scene);
  window.addEventListener('resize', resized);
  ctx.imageSmoothingQuality = 'high';

  /* ---------- 그림 불러오기 ---------- */
  const load = src => new Promise((ok, no) => {
    const i = new Image(); i.onerror = no; i.src = src;
    i.onload = () => i.decode ? i.decode().then(() => ok(i), () => ok(i)) : ok(i);   // 미리 풀어 둬서 처음 그릴 때 안 끊기게
  });
  const names = n => Array.from({length:n}, (_, i) => i + 1);
  const assets = {};
  Promise.all([
    Promise.all(names(5).map(i => load(`img/bg${i}.jpg`))),
    Promise.all(names(7).map(i => load(`img/m${i}.png`))),
    Promise.all(names(7).map(i => load(`img/f${i}.png`))),
    load('img/front.png'),
    load('img/onsenbg.jpg'),
    Promise.all(names(5).map(i => load(`img/tube${i}.png`))),   // 온천탕 (김이 올라와요)
    load('img/duck2.png'),                                       // 탕에 앉은 남자 또덕이
    load('img/duck2f.png'),                                      // 탕에 앉은 여자 또덕이
    load('img/water0.png'),                                      // 물 자리 (물 색을 입힐 때 써요)
    load('img/rest.jpg'),                                        // 휴게실
    Promise.all(names(7).map(i => load(`img/mt${i}.png`))),     // 양머리 수건 쓴 또덕이 (걷기)
    load('img/towelm.png'), load('img/towelf.png'),              // 양머리 수건 쓴 또덕이 (탕 안, 남자 / 여자)
    load('img/bubble.png'),                                      // 말풍선
    load('img/towels.png'),                                      // 카운터에 놓인 수건 (남아 있을 때만 보여요)
    Promise.all(names(7).map(i => load(`img/g${i}.png`))),      // 할머니 또덕이 (걷기)
    load('img/gtub.png'),                                        // 할머니 또덕이 (탕 안)
    load('img/stool.png'),                                       // 씻는 자리 의자
    Promise.all(names(5).map(i => load(`img/wash${i}.png`))),   // 의자에 앉아 머리 감는 또덕이 (의자까지 그려진 그림)
    Promise.all(['m', 'mt', 'ft', 'g', 'gt'].map(k => load(`img/sit_${k}.png`))),   // 휴게실에 앉은 또덕이: 남자, 양머리 남자, 양머리 여자, 할머니, 양머리 할머니
  ]).then(([bg, m, f, front, onsenBg, tubEmpty, duck2, duck2f, water, rest, t, towelM, towelF, bubbleImg, towels, g, gtub, stool, wash, sit]) => {
    Object.assign(assets, {bg, m, f, front, onsenBg, tubEmpty, duck2, duck2f, water, rest, t, towelM, towelF, bubbleImg, towels, g, gtub, stool, wash});
    assets.sit = { m:sit[0], mt:sit[1], ft:sit[2], g:sit[3], gt:sit[4] };
    document.getElementById('loading').hidden = true;
    if (!save.nick) askNick(true);                                // 닉네임부터 정해요
    else if (!save.tut) startTutorial();                          // 처음 시작한 사람에게만 안내를 보여 줘요
    nextSpawnAt = clock() + 600;
    requestAnimationFrame(tick);
  }).catch(() => { document.getElementById('loading').textContent = '그림을 불러오지 못했어요'; });

  /* ---------- 자리 (화면 비율 0~1, 발 위치 기준) ---------- */
  const ENTRANCE = {x:.420, y:.310, h:.250};   // 보라색: 입구
  const COUNTER  = {x:.470, y:.670, h:.410};   // 빨간색: 카운터 앞
  const BEND     = {x:.440, y:.470};           // 보라색 길이 휘는 곳
  const DOOR = { left:{x:.106, y:.305, h:.250}, right:{x:.826, y:.305, h:.250} };

  const ASK = [
    '화장실이 급해요!\n어디예요?',
    '화장실은\n어느 쪽이에요?',
    '저… 화장실 좀 쓸게요. 어디죠?',
    '화장실 어디로 가면 돼요?',
  ];
  const ASK_ONSEN = ['온천이 어디예요?', '어른 한 명이요!\n온천이 어디예요?', '온천하러 왔어요.\n어디로 가요?', '온천은 어느 쪽이에요?'];
  const ASK_ONSEN_BACK = ['온천이 어디예요?', '이제 온천 갈래요!\n온천이 어디예요?', '시원하다~\n온천은 어디예요?'];
  const RESTROOM_CHANCE = .25;   // 새 손님 중 화장실부터 찾는 비율 (나머지는 바로 온천)
  // 카운터 양쪽에 놓인 수건 자리 (왼쪽 = 남자, 오른쪽 = 여자). 온천 가는 길에 들르면 양머리 수건을 써요
  const TOWEL_SPOT = { left:{x:.200, y:.700, h:.400}, right:{x:.775, y:.700, h:.400} };
  const TOWEL_CHANCE = .5;       // 온천 손님 중 수건을 구경하고 가는 비율 (수건이 남아 있을 때)
  const SHAMPOO_PACK = 10;       // 상점에서 한 번 사면 들어오는 샴푸 (또덕이 10마리가 쓸 양)
  const SHAMPOO_PRICE = 500;     // 샴푸로 머리를 감으면 들어오는 또코인
  const TOWEL_PACK = 10;         // 상점에서 한 번 사면 들어오는 수건 수 = 손님 10명이 가져가면 다 떨어져요
  let towelsOnHold = 0;          // 가지러 걸어가는 중인 또덕이 몫
  const TOWEL_LOOK = 1000;       // 수건 앞에서 구경하는 시간
  const TOWEL_PRICE = 800;       // 수건을 가져가면 들어오는 또코인
  const SIDE = { left:{x:-.20, y:.560, h:.380}, right:{x:1.20, y:.560, h:.380} };   // 온천: 화면 옆으로
  const BACK_AFTER = 20000;      // 화장실에 간 뒤 다시 나오기까지 (20초)
  const THANKS = ['감사합니다!', '고마워요!'], THANKS_WC = ['감사합니다!', '고마워요!', '살았다…!'];   // '살았다'는 화장실 갈 때만
  const OOPS = ['어… 거긴 아닌 것 같은데요?', '앗, 반대쪽 아닌가요?'];
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const PRICE = 4000;            // 온천에 한 번 들어갈 때 받는 입장료

  /* ---------- 상태 ---------- */
  let served = 0, money = 0, lastSex = null, streak = 0;
  const inRestroom = [];         // 화장실에 들어가 있는 또덕이들
  const queue = [];              // 줄 선 또덕이들 (맨 앞 = 카운터 앞)
  const leavers = [];            // 안내받고 걸어가는 또덕이들
  let nextSpawnAt = 0;
  // 줄 자리: 맨 앞은 카운터 앞, 뒤로 갈수록 오른쪽 뒤로 멀어져요
  const LINE = [
    COUNTER,
    {x:.665, y:.590, h:.355},
    {x:.790, y:.520, h:.310},
    {x:.885, y:.462, h:.275},
  ];
  const STALE_AFTER = 40;        // 손님이 이만큼 다녀가도록 탕·장식을 안 바꾸면 "달라진 게 없다"고 해요
  const ORDER_WAIT = 30000;      // 음식을 시키고 기다려 주는 시간
  const REVIEW_CHANCE = .2;      // 리뷰를 남기는 손님 (5명 중 1명쯤)
  const REVIEW_TEXT = {
    wrong:  ['시킨 음식이 아닌 걸 주셨어요… 흥!', '계란 시켰는데 딴 게 왔어요. 실망이에요', '주문을 잘 안 들으시는 것 같아요'],
    late:   ['음식을 시켰는데 끝까지 안 왔어요…', '배고픈데 한참 기다리다 그냥 나왔어요', '주문이 너무 늦어요. 꽥…'],
    towel:  ['수건이 없어서 양머리를 못 했어요', '수건이 다 떨어졌더라고요. 아쉬워요'],
    shampoo:['샴푸가 없어서 물로만 감았어요', '씻는 곳에 샴푸가 없어요…'],
    stale:  ['올 때마다 똑같아요. 새로운 게 있었으면…', '예전이랑 달라진 게 없네요', '좀 심심해요. 탕 좀 바꿔 주세요'],
    food:   ['탕에서 먹는 간식 최고예요!', '시킨 음식이 바로 나와서 좋았어요. 냠냠!'],
    water:  ['물이 정말 좋아요! 몸이 사르르~', '탕이 고급스러워요. 또 올게요!'],
    deco:   ['랜턴이랑 꽥꽥이가 귀여워요!', '분위기가 아늑해서 좋았어요'],
    ok:     ['따뜻하고 좋았어요', '잘 쉬다 갑니다. 꽥!', '평범하지만 편했어요', '또 올게요~'],
    granny: ['아이고 시원~하다. 잘 쉬다 간다', '뜨끈하니 좋구나. 또 오마'],
  };
  function review(who, key, huff) {      // 탕에서 나갈 때, 5명 중 1명쯤이 리뷰를 남겨요
    if (!who.late && Math.random() >= REVIEW_CHANCE) return;   // 음식을 못 받고 나간 손님은 꼭 써요
    const room = save.rooms[key], bad = [], good = [];
    let st = 4;
    if (who.late) { st -= 3; bad.push('late'); }
    else if (huff) { st -= 3; bad.push('wrong'); }
    if (who.noTowel) { st -= 1; bad.push('towel'); }
    if (who.noShampoo) { st -= 1; bad.push('shampoo'); }
    if (save.stale >= STALE_AFTER) { st -= 1; bad.push('stale'); }
    if (who.fed) { st += 1; good.push('food'); }
    if ((WATERS[room.water] || WATERS.base).bonus >= 3000) { st += 1; good.push('water'); }
    else if (room.lantern && room.toy) { st += 1; good.push('deco'); }

      if (id !== 'base') for (const k of ROOM_KEYS) if (k !== sheetKind && isRoom2(k) && save.rooms[k].water === id) {   // 온천방 2가 쓰던 탕을 가져가면 그 방은 그냥 탕으로
        save.rooms[k].water = 'base'; announce(`${ROOMS[k].name}는 그냥 탕으로 바뀌었어요`);
      }
      keep();
    }
    else if (b.dataset.deco) { const c = save.rooms[sheetKind]; c[b.dataset.deco] = !c[b.dataset.deco]; save.stale = 0; keep(); }
    else return;
    renderSheet();
  });

  // 물 색 입히기: 물 자리 그림에 색을 채운 판을 만들어 두고 탕 위에 겹쳐요
  const tintCache = {};
  function tintLayer(color, maskIndex) {
    const key = color + maskIndex;
    if (!tintCache[key]) {
      const m = assets.water, c = document.createElement('canvas');
      c.width = m.width; c.height = m.height;
      const x = c.getContext('2d');
      x.drawImage(m, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
      tintCache[key] = c;
    }
    return tintCache[key];
  }
  // 색 입힌 탕 그림은 한 번 만들어 두고 다시 써요 (매번 색을 입히면 느려져요)
  const tubCache = new Map();
  function tubImage(variant, fi, waterId, maskIndex) {
    const img = assets[variant][fi], w = WATERS[waterId];
    if (!w.color) return img;
    const key = variant + fi + waterId;
    let c = tubCache.get(key);
    if (!c) {
      const k = Math.min(1, TUB.w * S / img.width);
      c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext('2d'), layer = tintLayer(w.color, maskIndex);
      x.drawImage(img, 0, 0, c.width, c.height);
      x.globalCompositeOperation = 'color'; x.globalAlpha = .92; x.drawImage(layer, 0, 0, c.width, c.height);
      x.globalCompositeOperation = 'source-over'; x.globalAlpha = w.wash; x.drawImage(layer, 0, 0, c.width, c.height);
      if (tubCache.size >= 12) tubCache.delete(tubCache.keys().next().value);
      tubCache.set(key, c);
    }
    return c;
  }
  /* ---------- 온천방 아래 칸: 가진 음식을 눌러서 주문한 또덕이에게 줘요 ---------- */
  const bag = document.getElementById('bag');
  let currentRoom = null;         // 지금 보고 있는 (열려 있는) 온천방
  function renderBag() {
    const foods = ownedFoods();
    bag.innerHTML = foods.length ? foods.map(i =>
      `<button data-give="${i.id}" aria-label="${i.name} 주기, ${left(i.id)}개 남음"><img src="${i.pic}" alt=""><span class="n">${left(i.id)}</span></button>`).join('')
      : '<span class="hint">가진 음식이 없어요.<br>상점에서 사 오세요.</span>';
  }
  renderBag();
  const say2 = (r, text, color) => { r.pop = { text, color, t0: clock() }; };   // 탕 위에 잠깐 뜨는 글씨
  bag.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || !currentRoom) return;
    const it = FOODS.find(i => i.id === b.dataset.give), r = ROOMS[currentRoom], now = clock();
    if (!it || left(it.id) < 1) return;
    if (!r.order) return say2(r, '주문한 또덕이가 없어요');
    const who = r.order.who;
    if (r.order.food.id === it.id) {           // 맞게 줬어요: 1개 쓰고 음식 값을 받아요
      save.stock[it.id] = left(it.id) - 1; who.fed = true; r.order = null;
      gain(it.pay, r.at + .5, .47);            // 글씨는 탕 위에 따로 떠요
      note('foods', it.id); mood(2);
      say2(r, `냠냠! +${it.pay.toLocaleString('ko-KR')}`);
      keep(); showMoney(); if (sheetKind) renderSheet();
    } else {                                   // 잘못 줬어요: 화나서 바로 나가고, 음식 값도 못 받아요
      say2(r, '이거 아닌데!', '#ff3d28');
      leaveTub(currentRoom, now, who, true);
      note('guests', 'huff'); mood(-6); keep(); if (sheetKind) renderSheet();
    }
  });
  const foodImg = {}; for (const i of FOODS) { foodImg[i.id] = new Image(); foodImg[i.id].src = i.pic; }
  function label(text, x, y, px, color) {      // 흰 테두리가 있는 글씨
    ctx.font = `700 ${px}px Sehyun, sans-serif`; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    ctx.lineWidth = px * .3; ctx.strokeStyle = '#fff'; ctx.strokeText(text, x, y);
    ctx.fillStyle = color || '#1c1000'; ctx.fillText(text, x, y);
  }
  const decoImg = {}; for (const k of ['lantern', 'toy']) { decoImg[k] = new Image(); decoImg[k].src = PIC[k]; }

  let swipe = null, swiped = false;
  scene.addEventListener('pointerdown', e => { if (sheetKind) return; swipe = {x:e.clientX, y:e.clientY}; swiped = false; });
  scene.addEventListener('pointerup', e => {
    if (!swipe) return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y; swipe = null;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 45) return;
    if (ax > ay * 1.3) {                     // 옆으로 밀기: 왼쪽으로 밀면 왼쪽 방(남탕 쪽), 오른쪽으로 밀면 오른쪽 방(여탕 쪽)
      swiped = true; go(view + (dx < 0 ? -1 : 1));
    }
  });
  scene.addEventListener('pointercancel', () => { swipe = null; });
  scene.addEventListener('click', e => { if (swiped) { swiped = false; e.stopPropagation(); e.preventDefault(); } }, true);

  /* ---------- 할머니 또덕이: 여탕으로 가는 특별 손님. 천천히 걷고, 수건은 안 써요 ---------- */
  const GRANNY_CHANCE = .15;     // 새 손님이 할머니일 확률
  const GRANNY_SLOW = 1.35;      // 걷는 데 걸리는 시간 (보통 또덕이의 몇 배)
  const GRANNY_TUB = { w:.34, h:.2709 };   // 탕 안 그림 크기 (온천탕 그림 안에서의 비율)
  const GRANNY_SAY = {
    onsen: ['아이고~ 온천이\n어디니?', '뜨끈한 물에 몸 좀\n담그러 왔단다', '얘야, 온천은\n어느 쪽이니?'],
    wc:    ['아이고 급해라,\n화장실이 어디니?'],
    back:  ['이제 온천 가야지.\n어느 쪽이니?'],
    thanks:['고맙구나~', '착하기도 하지!'],
    oops:  ['아이고, 거긴\n아닌 것 같은데?'],
  };
  // 걷는 그림 고르기: 양머리 수건 > 할머니 > 남자·여자
  const spriteOf = g => g.towel ? assets.t : g.kind === 'granny' ? assets.g : assets[g.sex];
  function newGuest(sex, phase, from, now) {
    return { sex, phase, slot:-1, state:'line', asked:false, born:now, x:from.x, y:from.y, h:from.h, alpha:0, shake:0, happy:false, move:null };
  }
  function spawn(now) {
    let sex = Math.random() < .5 ? 'm' : 'f';
    if (sex === lastSex && streak >= 2) sex = sex === 'm' ? 'f' : 'm';   // 같은 손님만 계속 나오지 않게
    streak = sex === lastSex ? streak + 1 : 1; lastSex = sex;
    const g = newGuest(sex, Math.random() < RESTROOM_CHANCE ? 1 : 2, ENTRANCE, now);
    if (sex === 'f' && tutAt < 0 && Math.random() < GRANNY_CHANCE * 2) g.kind = 'granny';   // 여자 손님 중에서 뽑아요 (전체의 15%쯤)
    return g;
  }
  function comeBack(r, now) {    // 화장실에서 나와 다시 줄 서기
    const g = newGuest(r.sex, 2, DOOR[r.side], now); g.back = true; g.kind = r.kind; return g;
  }
  // 지금 자리에서 목적지까지 걷기 (ctrl: 휘어 가는 길의 가운데 점)
  function walkTo(g, to, now, dur, ctrl) {
    const d = Math.hypot(to.x - g.x, to.y - g.y);
    g.move = { fx:g.x, fy:g.y, fh:g.h, tx:to.x, ty:to.y, th:to.h, t0:now,
               dur: (dur || Math.max(650, d * 5500)) * (g.kind === 'granny' ? GRANNY_SLOW : 1),
               cx: ctrl ? ctrl.x : (g.x + to.x) / 2, cy: ctrl ? ctrl.y : (g.y + to.y) / 2 };
  }

  function setAsking(on) {
    btnL.disabled = btnR.disabled = !on;
    scene.classList.toggle('asking', on);
  }
  function say(text) {
    bubble.textContent = text;
    bubble.style.whiteSpace = 'pre-line';
    bubble.classList.add('show');
  }
  function hush() { bubble.classList.remove('show'); }

  function choose(side) {
    const guest = queue[0];
    if (!guest || !guest.asked || guest.state !== 'line') return;
    const now = clock();
    const right = guest.sex === 'm' ? 'left' : 'right';
    if (side !== right) {            // 틀려도 벌은 없어요
      guest.shake = now;
      say(pick(guest.kind === 'granny' ? GRANNY_SAY.oops : OOPS));
      return;
    }
    setAsking(false);
    tutGuided++;
    guest.happy = true;
    guest.state = 'thanks'; guest.t0 = now; guest.side = side;
    say(pick(guest.kind === 'granny' ? GRANNY_SAY.thanks : guest.phase === 1 ? THANKS_WC : THANKS));
  }
  btnL.addEventListener('click', () => choose('left'));
  btnR.addEventListener('click', () => choose('right'));
  document.getElementById('doorL').addEventListener('click', () => choose('left'));
  document.getElementById('doorR').addEventListener('click', () => choose('right'));
  addEventListener('keydown', e => {
    if (view !== 0 || viewY !== 0) return;   // 카운터에 있을 때만
    if (e.key === 'ArrowLeft') choose('left');
    if (e.key === 'ArrowRight') choose('right');
  });

  /* ---------- 움직임 ---------- */
  const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
  const lerp = (a, b, t) => a + (b - a) * t;
  const bez = (a, c, b, t) => (1-t)*(1-t)*a + 2*(1-t)*t*c + t*t*b;

  function update(now) {
    showPop();
    for (const [el, dir] of [[hintL, -1], [hintR, 1]]) {    // 가장 급한 주문을 그쪽 가장자리에 보여 줘요
      let best = null;
      for (const r of Object.values(ROOMS)) if (r.order && (r.at - view) * dir > 0 && (!best || r.order.t0 < best.order.t0)) best = r;
      el.hidden = !best || !!sheetKind; if (!best) continue;
      const left = Math.max(0, 1 - (now - best.order.t0) / ORDER_WAIT), img = el.querySelector('img'), bar = el.querySelector('i');
      if (img.dataset.id !== best.order.food.id) { img.dataset.id = best.order.food.id; img.src = best.order.food.pic; }
      bar.style.width = left * 100 + '%'; bar.style.background = left > .5 ? '#5fce5a' : left > .25 ? '#ffb300' : '#ff3d28';
      el.dataset.at = best.at;
    }
    // 새 손님 (화장실에서 나올 차례인 또덕이가 먼저)
    if (queue.length < LINE.length && now >= nextSpawnAt) {
      const i = inRestroom.findIndex(r => now >= r.readyAt);
      queue.push(i >= 0 ? comeBack(inRestroom.splice(i, 1)[0], now) : spawn(now));
      const pp = popularity() / 100, lo = lerp(GAP_QUIET[0], GAP_BUSY[0], pp), hi = lerp(GAP_QUIET[1], GAP_BUSY[1], pp);
      nextSpawnAt = now + lo + Math.random() * (hi - lo);   // 손님이 나갔다고 바로 오는 게 아니라, 인기에 따라 와요
    }
    // 줄 자리 맞추기: 앞이 비면 한 칸씩 앞으로
    queue.forEach((g, i) => { if (g.slot !== i) { g.slot = i; walkTo(g, LINE[i], now); } });

    // 걷기
    for (const g of [...queue, ...leavers]) {
      g.alpha = Math.min((now - g.born) / 350, 1);
      const m = g.move; if (!m) continue;
      const t = Math.min((now - m.t0) / m.dur, 1), e = ease(t);
      g.x = bez(m.fx, m.cx, m.tx, e); g.y = bez(m.fy, m.cy, m.ty, e); g.h = lerp(m.fh, m.th, e);
      if (g.state === 'leave' && g.phase !== 2 && t > .86) g.alpha = 1 - (t - .86) / .14;   // 화장실 문이나 입구로 쏙
      if (t >= 1) g.move = null;
    }

    // 맨 앞 또덕이
    const f = queue[0];
    if (f && !f.move && !f.asked) {
      f.asked = true;
      const gs = f.kind === 'granny' ? GRANNY_SAY : null;
      say(pick(f.phase === 1 ? (gs ? gs.wc : ASK) : f.back ? (gs ? gs.back : ASK_ONSEN_BACK) : (gs ? gs.onsen : ASK_ONSEN))); setAsking(true);
    }
    if (f && f.state === 'thanks' && now - f.t0 > 800) {
      hush(); f.happy = false; f.state = 'leave';
      queue.shift(); leavers.push(f);
      const toRestroom = f.phase === 1;                 // 화장실은 문으로, 온천은 화면 옆으로
      const d = (toRestroom ? DOOR : SIDE)[f.side];
      if (!toRestroom && f.kind !== 'granny' && save.towels - towelsOnHold <= 0 && Math.random() < TOWEL_CHANCE) f.noTowel = true;   // 수건을 쓰고 싶었는데 없어요
      if (!toRestroom && f.kind !== 'granny' && save.towels - towelsOnHold > 0 && Math.random() < TOWEL_CHANCE) {   // 수건이 남아 있으면 구경하러
        towelsOnHold++; f.stop = TOWEL_SPOT[f.side]; walkTo(f, f.stop, now, 1300);
      }
      else walkTo(f, d, now, 2400, { x: lerp(f.x, d.x, .45), y: toRestroom ? .40 : .585 });
    }

    // 다 걸어간 또덕이
    for (let i = leavers.length - 1; i >= 0; i--) {
      const g = leavers[i]; if (g.move) continue;
      if (g.stop) {                                       // 수건 앞에서 잠깐 구경하고, 양머리를 쓰고 가요
        if (!g.lookT0) g.lookT0 = now;
        if (now - g.lookT0 < TOWEL_LOOK) continue;
        g.stop = null; g.towel = true;
        towelsOnHold--; save.towels = Math.max(0, save.towels - 1);     // 수건 1장을 가져가요
        if (!save.towels) announce('수건이 다 떨어졌어요!\n상점에서 살 수 있어요');
        gain(TOWEL_PRICE, g.x, g.y - g.h * .75, '+' + TOWEL_PRICE.toLocaleString('ko-KR'));   // 수건 값
        keep(); showMoney(); if (sheetKind) renderSheet();
        walkTo(g, SIDE[g.side], now, 1500);
        continue;
      }
      leavers.splice(i, 1);
      if (g.phase === 3) continue;                       // 온천을 마치고 집에 간 또덕이
      if (g.phase === 1) { inRestroom.push({ sex:g.sex, kind:g.kind, side:g.side, readyAt:now + BACK_AFTER }); note('guests', 'wc'); keep(); if (sheetKind) renderSheet(); }
      else {
        const room = pickRoom(g.sex), who = { sex:g.sex, kind:g.kind, towel: !!g.towel, noTowel: !!g.noTowel };
        if (!ROOMS[room].shower) {                                        // 샤워 자리가 비었으면 씻고 들어가요
          const foam = save.shampoo > 0; if (foam) save.shampoo--;        // 샴푸가 있으면 1번 써요
          who.noShampoo = !foam; ROOMS[room].shower = { who, t0: now, foam };
        }
        else enterTub(room, who, now);                                    // 누가 씻는 중이면 바로 탕으로
        const fee = PRICE + WATERS[save.rooms[room].water].bonus;      // 입장료 + 물 값
        note('guests', g.kind || g.sex); if (g.towel) note('guests', 't' + g.sex); note('waters', save.rooms[room].water);   // 도감에 적어요
        if (++save.stale === STALE_AFTER) announce('손님들이 달라진 게 없대요…\n탕이나 장식을 바꿔 볼까요?');
        served++; gain(fee, g.side === 'left' ? .17 : .83, .47, '+' + fee.toLocaleString('ko-KR'));
        keep(); showMoney(); if (sheetKind) renderSheet();
      }
    }
  }

  function drawGuest(g, now) {
    const frames = spriteOf(g);
    const walking = !!g.move, wt = walking ? now - g.move.t0 : 0;
    let img;
    if (g.happy) img = frames[0];                                   // 눈 감고 웃는 그림
    else if (walking) img = frames[1 + Math.floor(wt / 125) % 6];
    else img = frames[1 + Math.floor((now + g.born) / 520) % 2];    // 서서 살짝 꼼지락

    const h = g.h * S * img.height / 380, w = h * img.width / img.height;   // 380 = 보통 또덕이 그림 높이 (키 큰 그림은 그만큼 크게)
    let x = g.x * S, y = g.y * S;
    if (walking) y -= Math.abs(Math.sin(wt / 125 * Math.PI)) * h * .025;
    if (g.happy) y -= Math.abs(Math.sin((now - g.t0) / 400 * Math.PI)) * h * .07;
    if (g.shake) {
      const s = (now - g.shake) / 450;
      if (s < 1) x += Math.sin(s * Math.PI * 6) * (1 - s) * h * .05; else g.shake = 0;
    }
    ctx.globalAlpha = Math.max(0, Math.min(1, g.alpha));
    ctx.drawImage(img, x - w / 2, y - h, w, h);
    ctx.globalAlpha = 1;
  }
  function drawGuests(now) {      // 멀리 있는 또덕이부터 그려서 가까운 또덕이가 앞에 오게
    for (const g of [...queue, ...leavers].sort((a, b) => a.y - b.y)) drawGuest(g, now);
  }

  /* ---------- 처음 안내 (튜토리얼): 봐야 할 곳만 밝게 두고 한 단계씩 따라 하게 해요 ---------- */
  //   target = 밝게 둘 곳, hand = 손가락이 움직이는 방향, done = 이게 참이 되면 다음 단계로, ok = "알겠어요"를 눌러 넘기는 단계
  const tutEl = document.getElementById('tut'), tutHole = document.getElementById('tutHole'), tutBox = document.getElementById('tutBox');
  const tutHand = document.getElementById('tutHand'), tutOk = document.getElementById('tutOk');
  const SET_BTN = { m:'setM', f:'setF', m2:'setM2', f2:'setF2' };
  const atLobby = () => view === 0 && !viewY;
  let tutAt = -1, tutGuided = 0, tutSide = -1;
  const TUT = [
    { text:'먼저 손님부터 받아 볼까요?\n나비넥타이 또덕이는 왼쪽,\n리본 또덕이는 오른쪽이에요!', target:() => document.querySelector('.guide'), done:() => tutGuided >= 1 },
    { text:'잘했어요!\n이제 화면을 옆으로 밀어 볼까요?', target:() => scene, hand:'left', done:() => !viewY && view !== 0 },
    { text:'여기가 온천방이에요.\n♨를 누르면 물 색을 바꾸고\n랜턴과 꽥꽥이를 놓을 수 있어요', target:() => currentRoom && document.getElementById(SET_BTN[currentRoom]), ok:true, done:() => !!ROOMS[sheetKind] },
    { text:'또덕이가 음식을 시키면\n아래 칸에서 눌러서 주면 돼요.\n이제 반대로 밀어 카운터로 돌아가요', target:() => scene, hand:() => tutSide < 0 ? 'right' : 'left', done:atLobby },
    { text:'옆으로 계속 밀면 온천방 2와\n맨 끝의 휴게실이 나와요.\n휴게실 쓰레기통이 차면 눌러서 비워 줘요', target:() => scene, ok:true },
    { text:'여기는 상점이에요.\n수건, 샴푸, 음식, 새 탕을 살 수 있어요', target:() => document.getElementById('shop'), ok:true, done:() => sheetKind === 'shop' },
    { text:'책은 단골 도감, 말풍선은 손님 리뷰,\n트로피는 랭킹, 톱니바퀴는 설정이에요.\n준비 끝! 또덕이 온천을 잘 부탁해요', target:() => document.querySelector('.dock'), ok:true },
  ];
  function showTutStep() {
    const st = TUT[tutAt];
    document.getElementById('tutText').textContent = st.text;
    tutOk.hidden = !st.ok;
    const hand = typeof st.hand === 'function' ? st.hand() : st.hand;
    tutHand.hidden = !hand;

    nickInput.value = save.nick; document.getElementById('nickOk').textContent = first ? '시작하기' : '바꾸기';
    setTimeout(() => nickInput.focus(), 50);
  }
  document.getElementById('nickForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = nickInput.value.trim();
    if (!name) { nickErr.textContent = '닉네임을 한 글자 이상 써 주세요'; nickInput.focus(); return; }
    save.nick = name; keep(); nickOpen = false; nickEl.hidden = true; nickInput.blur();
    announce(nickFirst ? `${name} 사장님, 어서 오세요!` : `닉네임을 ${name}(으)로 바꿨어요`);
    if (sheetKind === 'settings') { sheetList.dataset.kind = ''; renderSheet(); }
    rankSend(true);                                              // 바꾼 닉네임을 랭킹에도 알려요
    if (nickFirst && !save.tut) startTutorial();
  });
  function clock() {
    const real = performance.now();
    if (sheetKind || nickOpen) pausedMs += real - lastReal;
    lastReal = real; return real - pausedMs;
  }
  function tick(now) {
    now = clock();
    update(now);
    tutTick();
    cam += (view - cam) * .16; if (Math.abs(view - cam) < .001) cam = view;
    const key = viewY ? null : ROOM_AT[view], open = !!key && !ROOMS[key].ui.classList.contains('is-locked');
    const mode = open ? key : view === 0 && !viewY ? 'lobby' : 'away';
    if (mode !== barMode) {                  // 아래 칸: 카운터 = 안내 버튼, 온천방 = 가진 음식, 그 밖 = 빈칸
      barMode = mode; currentRoom = open ? key : null;
      ambience(open);
      document.getElementById('controls').className = 'controls' + (open ? ' onsen' : mode === 'away' ? ' away' : '');
    }
    const want = currentRoom && ROOMS[currentRoom].order ? ROOMS[currentRoom].order.food : null;
    if ((want ? want.id : '') !== (bag.dataset.order || '')) {   // 화면을 못 보는 사람에게도 주문을 알려요
      bag.dataset.order = want ? want.id : '';
      bag.setAttribute('aria-label', want ? `가진 음식. 또덕이가 ${want.name}을(를) 시켰어요` : '가진 음식');
    }
    camY += (viewY - camY) * .16; if (Math.abs(viewY - camY) < .001) camY = viewY;
    const place = (el, x, y) => {             // 방마다 버튼 판을 그 방 자리에 맞춰요
      const dx = x - cam, dy = y - camY;
      const t = `translate(${dx * 100}%, ${dy * 100}%)`;
      if (el._t === t) return;               // 안 움직였으면 그대로 둬요
      el._t = t; el.style.transform = t;
      el.style.visibility = Math.abs(dx) < .999 && Math.abs(dy) < .999 ? 'visible' : 'hidden';
    };
    place(lobbyUi, 0, 0); place(restUi, restSide(), 0);
    for (const r of Object.values(ROOMS)) place(r.ui, r.at, 0);

    updateRest(now);
    if (Math.abs(restSide() - cam) < .999) drawRest((restSide() - cam) * S, now);   // 휴게실 (맨 끝 방)
    ctx.save(); ctx.translate(0, -camY * S);  // 1층 방들
    for (const [key, r] of Object.entries(ROOMS)) {
      while (r.soaking.length && r.soaking[0].until <= now) leaveTub(key, now);
      if (r.shower && now - r.shower.t0 >= SHOWER_TIME) {  // 다 씻었으면 탕으로 (샴푸를 썼으면 샴푸 값도 받아요)
        if (r.shower.foam) {
          gain(SHAMPOO_PRICE, r.at + .16, .60, '+' + SHAMPOO_PRICE.toLocaleString('ko-KR'));
          if (!save.shampoo) announce('샴푸가 다 떨어졌어요!\n상점에서 살 수 있어요');
          keep(); if (sheetKind) renderSheet();
        }
        enterTub(key, r.shower.who, now); r.shower = null;
      }
      if (r.order && now - r.order.t0 > ORDER_WAIT) {      // 시간 안에 안 주면 포기해요
        const w = r.order.who; w.late = true; r.order = null; mood(-3); say2(r, '너무 늦어…', '#ff3d28');
        leaveTub(key, now, w, true); note('guests', 'huff'); keep();
      }
      if (!r.order) {                                      // 음식 주문은 방마다 한 번에 한 마리만 (사 둔 음식이 없어도 시켜요)
        const who = r.soaking.find(s => s.slot >= 0 && s.orderAt && now >= s.orderAt);
        if (who) { who.orderAt = 0; r.order = { who, food: pick(FOODS), t0: now }; }
      }
      for (let i = r.walkers.length - 1; i >= 0; i--) {    // 방을 다 걸어 나가면 카운터를 지나 입구로
        const w = r.walkers[i]; if (now - w.t0 < WALK_OUT) continue;
        r.walkers.splice(i, 1);
        if (!w.huff && restHasRoom() && Math.random() < REST_CHANCE) { enterRest(w, now); continue; }   // 휴게실에 들렀다 가요
        const side = r.at < 0 ? 'left' : 'right', g = newGuest(w.sex, 3, SIDE[side], now);
        g.towel = w.towel; g.kind = w.kind;
        g.state = 'leave'; g.slot = 0;
        walkTo(g, ENTRANCE, now, 3200, { x: lerp(SIDE[side].x, ENTRANCE.x, .55), y:.58 });
        leavers.push(g);
      }
      if (Math.abs(r.at - cam) >= .999 || camY <= -.999) continue;   // 화면에 안 보이는 방
      const ox = (r.at - cam) * S, n = r.soaking.length, fi = Math.floor(now / 250) % 5, cfg = save.rooms[key];
      ctx.drawImage(assets.onsenBg, ox, 0, S, S);
      const tx = ox + TUB.x * S, ty = TUB.y * S, tw = TUB.w * S, th = TUB.h * S;
      ctx.drawImage(tubImage('tubEmpty', fi, cfg.water, 0), tx, ty, tw, th);
      if (cfg.lantern && decoImg.lantern.complete) {       // 랜턴: 탕 위쪽 가운데 돌 위 (또덕이보다 먼저 그려서 또덕이 뒤에 서 있게)
        const lh = .185 * th, lw = lh * 60 / 96, lx = tx + .528 * tw - lw / 2, ly = ty + .285 * th - lh;
        const gx = lx + lw / 2, gy = ly + lh * .4, gr = lh * (.95 + Math.sin(now / 300) * .03);
        const glow = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
        glow.addColorStop(0, 'rgba(255,236,150,.75)'); glow.addColorStop(1, 'rgba(255,236,150,0)');
        ctx.fillStyle = glow; ctx.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);
        ctx.drawImage(decoImg.lantern, lx, ly, lw, lh);
      }
      const tw_ = r.towel, towelImg = assets[tw_.img];
      for (let i = 0; i < r.slots.length; i++) {           // 뒤쪽 자리부터 그려요
        const who = r.soaking.find(d => d.slot === i); if (!who) continue;
        const e = r.slots[i];
        if (who.towel) ctx.drawImage(towelImg, tx + (e.x + tw_.dx) * tw, ty + e.y * th, tw_.w * tw, tw_.h * th);
        else if (who.kind === 'granny') ctx.drawImage(assets.gtub, tx + (e.x + (r.w - GRANNY_TUB.w) / 2) * tw, ty + (e.y + .02) * th, GRANNY_TUB.w * tw, GRANNY_TUB.h * th);
        else ctx.drawImage(assets[r.duck], tx + e.x * tw, ty + e.y * th, r.w * tw, r.h * th);
      }
      if (cfg.toy && decoImg.toy.complete) {               // 꽥꽥이: 물 위에서 둥실둥실
        const dw = .145 * tw, dh = dw * 52 / 64, bob = Math.sin(now / 520) * .006 * th, t = moveToy(r, now);
        ctx.save(); ctx.translate(tx + t.x * tw, ty + t.y * th + bob); ctx.rotate(Math.sin(now / 900) * .07); ctx.scale(t.dir, 1);
        ctx.drawImage(decoImg.toy, -dw / 2, -dh / 2, dw, dh); ctx.restore();
      }
      if (r.soaking.length > TUB_SHOW) label(`탕 안 ${r.soaking.length}명`, ox + .70 * S, .335 * S, S * .042, '#1c1000');   // 안 보이는 또덕이까지 센 수
      drawShower(ox, now, 'base');
      if (r.shower) {                                      // 의자에 앉아 머리 감는 또덕이
        const wt = now - r.shower.t0, img = assets.wash[Math.floor(wt / (1000 / WASH.fps)) % assets.wash.length];
        const ww = STOOL.w * WASH.w * S, wh = ww * WASH.ratio;
        ctx.globalAlpha = Math.min(wt / 250, 1, (SHOWER_TIME - wt) / 200);
        ctx.drawImage(assets.stool, ox + STOOL.x * S - STOOL.w * S / 2, STOOL.bottom * S - STOOL.w * S * assets.stool.height / assets.stool.width, STOOL.w * S, STOOL.w * S * assets.stool.height / assets.stool.width);
        ctx.drawImage(img, ox + STOOL.x * S - ww / 2, STOOL.bottom * S - wh * WASH.by, ww, wh);
        ctx.globalAlpha = 1;
      }
      drawShower(ox, now, 'water', !!r.shower);
      if (save.shampoo > 0) {                              // 샴푸 통 (남아 있을 때만 의자 옆에 놓여요)
        const u = S, bx = ox + .252 * u, by = .972 * u;
        ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = '#1c1000'; ctx.lineWidth = u * .005;
        ctx.fillStyle = '#ff9ec4'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx - .020 * u, by - .070 * u, .040 * u, .070 * u, .008 * u) : ctx.rect(bx - .020 * u, by - .070 * u, .040 * u, .070 * u); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.fillRect(bx - .012 * u, by - .052 * u, .024 * u, .026 * u); ctx.strokeRect(bx - .012 * u, by - .052 * u, .024 * u, .026 * u);
        ctx.fillStyle = '#dfe6ea'; ctx.fillRect(bx - .008 * u, by - .086 * u, .016 * u, .016 * u); ctx.strokeRect(bx - .008 * u, by - .086 * u, .016 * u, .016 * u);
        ctx.beginPath(); ctx.moveTo(bx, by - .086 * u); ctx.lineTo(bx, by - .104 * u); ctx.lineTo(bx - .020 * u, by - .104 * u); ctx.stroke();
        ctx.restore();
      }
      if (r.shower && r.shower.foam) {                     // 샴푸 거품: 머리 위에서 뽀글뽀글
        const u = S, wt = now - r.shower.t0;
        ctx.save(); ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.strokeStyle = 'rgba(28,16,0,.55)'; ctx.lineWidth = u * .003;
        for (let i = 0; i < 9; i++) {
          const ph = wt / 520 + i * 1.7, rise = (ph % 1);
          const x = ox + (.135 + Math.sin(i * 2.4) * .062 + Math.sin(ph * 2) * .006) * u, y = (.690 - rise * .075 + Math.cos(i * 1.3) * .018) * u;
          ctx.globalAlpha = Math.min(1, wt / 400) * (1 - rise * .7);
          ctx.beginPath(); ctx.arc(x, y, (.012 + (i % 3) * .005) * u, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        }
        ctx.restore();
      }
      for (const w of r.walkers) {                         // 탕에서 나와 걸어가는 또덕이
        const wt = now - w.t0, t = Math.min(wt / WALK_OUT, 1);
        const img = spriteOf(w)[1 + Math.floor(wt / 125) % 6];
        const h = w.h * S * img.height / 380, ww = h * img.width / img.height;
        const x = ox + lerp(w.fx, w.tx, t) * S, y = w.y * S - Math.abs(Math.sin(wt / 125 * Math.PI)) * h * .025;
        ctx.globalAlpha = Math.min(wt / 300, 1);
        ctx.drawImage(img, x - ww / 2, y - h, ww, h);
        ctx.globalAlpha = 1;
        if (w.huff) label('흥!', x, y - h * 1.02, S * .05, '#ff3d28');
      }
      if (r.order) {                                       // 음식을 시킨 또덕이 머리 위 말풍선
        const at = r.slots[r.order.who.slot];
        const bw = .26 * tw, bh = bw * 547 / 760, bob = Math.sin(now / 400) * .004 * S;
        let tipX = tx + (at.x + r.w * .30) * tw; const tipY = ty + (at.y + r.h * .10) * th + bob;
        const flip = tipX - .987 * bw < ox + .01 * S;      // 왼쪽으로 넘치면 뒤집어서 오른쪽에
        if (flip) tipX = tx + (at.x + r.w * .70) * tw;
        ctx.save(); ctx.translate(tipX, tipY); if (flip) ctx.scale(-1, 1);
        ctx.drawImage(assets.bubbleImg, -.987 * bw, -.886 * bh, bw, bh);
        const pic_ = foodImg[r.order.food.id], iw = .50 * bw, ih = iw * 52 / 64;
        if (pic_.complete) ctx.drawImage(pic_, -.987 * bw + .44 * bw - iw / 2, -.886 * bh + .47 * bh - ih / 2, iw, ih);
        ctx.restore();
        // 기다려 주는 시간 게이지: 다 떨어지면 나가 버려요
        const leftT = Math.max(0, 1 - (now - r.order.t0) / ORDER_WAIT), gx = tipX + (flip ? .987 - .44 - .31 : -.987 + .44 - .31) * bw, gy = tipY - .886 * bh - .045 * bw, gw = .62 * bw, gh = .075 * bw;
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#1c1000'; ctx.lineWidth = S * .005;
        ctx.fillRect(gx, gy, gw, gh); ctx.fillStyle = leftT > .5 ? '#5fce5a' : leftT > .25 ? '#ffb300' : '#ff3d28'; ctx.fillRect(gx, gy, gw * leftT, gh); ctx.strokeRect(gx, gy, gw, gh);
      }
      if (r.pop) {                                         // "냠냠!" 같은 글씨가 잠깐 떠올라요
        const t = (now - r.pop.t0) / 1400;
        if (t >= 1) r.pop = null;
        else { ctx.globalAlpha = Math.min(1, (1 - t) * 2.5); label(r.pop.text, ox + .5 * S, (.50 - t * .05) * S, S * .058, r.pop.color); ctx.globalAlpha = 1; }
      }
    }
    if (Math.abs(cam) < .999 && camY > -.999) {   // 카운터
      const ox = -cam * S;
      ctx.save(); ctx.beginPath(); ctx.rect(ox, 0, S, S); ctx.clip(); ctx.translate(ox, 0);
      ctx.drawImage(assets.bg[Math.floor(now / 200) % 5], 0, 0, S, S);
      drawGuests(now);
      ctx.drawImage(assets.front, 0, S * .52, S, S * .48);          // 카운터는 손님 앞에
      if (save.towels > 0) ctx.drawImage(assets.towels, 0, S * .52, S, S * .48);   // 수건이 남아 있을 때만
      ctx.restore();
    }
    ctx.restore();
    requestAnimationFrame(tick);
  }
})();
</script>
